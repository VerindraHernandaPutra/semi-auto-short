[project]
name = "shorts-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.1.0",
    "fastapi[standard]>=0.159.1",
    "httpx>=0.28.1",
    "openai-whisper>=20250625",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.6",
    "tavily-python>=0.8.5",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
shorts = "shorts_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shorts_engine"]
