[project]
name = "shorts-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.1.0",
    "fastapi[standard]>=0.159.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "num2words>=0.5.14",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.27.0.42",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.6",
    "tavily-python>=0.8.5",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.3",
]

[project.scripts]
shorts = "shorts_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shorts_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI/Typer use calls in defaults by design. E501: formatter does not wrap strings.
# UP042: JobState(str, Enum) kept; StrEnum would change str() behaviour.
ignore = ["B008", "E501", "UP042"]
