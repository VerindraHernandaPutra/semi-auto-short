content_language: "en"

# Real services by default. `--dry-run` swaps all of them for local fakes.
providers:
  llm: "anthropic"  # mock, ollama, anthropic
  search: "tavily"  # mock, tavily
  footage: "pixabay"  # mock, pixabay, pexels
  asr: "whisper"  # mock, whisper

models:
  heavy: "claude-sonnet-5-5"
  light: "claude-haiku-5-5"

costs:
  budget_monthly_idr: 100000
  budget_per_video_idr: 5000
  usd_to_idr: 15500

# USD per million tokens. Verify against the provider's price list before trusting budgets.
# Haiku 5.5 prices apply to prompts up to 100K tokens; this project's prompts stay far below.
pricing:
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00

verification:
  min_verified_claims: 3
  quote_similarity_threshold: 0.92

topic_queue:
  min_queue_size: 10
  min_footage_candidates: 3
  min_clip_seconds: 5
  duplicate_similarity: 0.5  # word-overlap (Jaccard) at or above which two topics are duplicates
  min_specificity: 7  # self-rated 1-10; ideas below this are too broad
  min_novelty: 6  # self-rated 1-10; ideas below this are too commonly covered
  generation_batch_size: 12
  max_batches: 3

speech:
  words_per_second: 2.6
  target_duration_min: 35
  target_duration_max: 55

search:
  depth: "basic"  # basic = 1 Tavily credit per search, advanced = 2
  max_results: 3
  credit_usd: 0.0  # free plan; set 0.008 if you move to pay-as-you-go
  monthly_credit_limit: 900  # the free plan gives 1000; stop before it overflows

research:
  max_queries: 6  # SPEC 7.2: 3-6 queries
  min_distinct_domains: 2  # the hook rule (SPEC 7.3 rule 5) needs two independent domains
  max_sources: 6  # SPEC 7.2: the top 3-6 tier A/B pages
  max_sources_per_domain: 2
  max_chars_per_source: 12000  # about 3K tokens each; bounds the Sonnet extraction cost
