content_language: "en"

# Real services by default. `--dry-run` swaps all of them for local fakes.
providers:
  llm: "anthropic"  # mock, ollama, anthropic
  search: "tavily"  # mock, tavily
  footage: "pixabay"  # mock, pixabay, pexels
  asr: "whisper"  # mock, whisper

models:
  heavy: "claude-sonnet-5-5"
  light: "claude-haiku-5-5"

costs:
  budget_monthly_idr: 100000
  budget_per_video_idr: 5000
  usd_to_idr: 15500

# USD per million tokens. Verify against the provider's price list before trusting budgets.
# Haiku 5.5 prices apply to prompts up to 100K tokens; this project's prompts stay far below.
pricing:
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00

verification:
  min_verified_claims: 3
  quote_similarity_threshold: 0.92
  hook_min_domains: 2  # SPEC 7.3 rule 5
  max_hook_candidates: 4  # claims tried as the hook before giving up
  max_claims_extracted: 18  # 12 was reached on the Moon topic; more room means more usable material
  corroboration_search: true  # search for a second source for each hook candidate
  max_corroboration_searches: 4  # at most one search (1 Tavily credit) per hook candidate

topic_queue:
  min_queue_size: 10
  min_footage_candidates: 3
  min_clip_seconds: 5
  duplicate_similarity: 0.5  # word-overlap (Jaccard) at or above which two topics are duplicates
  min_specificity: 7  # self-rated 1-10; ideas below this are too broad
  min_novelty: 6  # self-rated 1-10; ideas below this are too commonly covered
  generation_batch_size: 12
  max_batches: 3

speech:
  words_per_second: 2.6
  target_duration_min: 35
  target_duration_max: 55

voice:
  # recorded = you record the script yourself; clone = your cloned voice (finish --clone).
  # The clone runs in its own Python environment: set VOICE_PYTHON in .env to its python.exe.
  reference: "data/voice/reference.wav"  # 20-30 s of your own voice, not committed
  exaggeration: 0.5
  cfg_weight: 0.5
  gap_s: 0.35
  timeout_s: 3600  # the first run also downloads the model (~3 GB)

audio:
  min_duration_s: 20
  max_duration_s: 60
  target_lufs: -16
  true_peak_db: -1.5
  silence_threshold_db: -45

footage:
  max_clip_mb: 60
  allowed_download_hosts: ["cdn.pixabay.com"]
  fallback_queries: ["space", "stars"]
  clip:
    enabled: true  # judge clips by their picture (CLIP model, ~150 MB downloaded once), not by tags
    candidates_per_shot: 16
    weak_probability: 0.2  # below this nothing is used for the shot
    # Things a clip must not be; a clip is picked when the shot's description beats all of these.
    negatives:
      - a cartoon or fantasy science fiction illustration
      - a globe of planet Earth
      - a landscape on Earth
      - a city or buildings seen from the air
      - a person
      - an abstract digital network
  # A clip must carry at least one of these tags (the channel's field), whatever else it matches.
  required_tags_any: [space, stars, galaxy, universe, astronomy, planet, telescope, nebula, jupiter, mars, moon, sun, comet, asteroid, observatory]
  # Tags that mark fiction. Pixabay tags are written by uploaders and can mislead, so a clip
  # with any of these words is not used for a fact video.
  avoid_tags: [fantasy, fiction, alien, ufo, spaceship, cartoon, anime, magic, dragon, christmas, globe, world, global, international, network, technology, internet, digital, hologram, city, asteroid, meteorite, land]

description:
  visuals_note: "Visuals are illustrative stock footage, not mission imagery."
  hashtags: ["#Shorts", "#Space", "#Astronomy", "#Science"]

render:
  encoder: "libx264"  # libx264 (CPU, safest) or h264_nvenc (GPU)
  preset: "veryfast"
  crf_draft: 16
  crf_final: 20
  blur: 12
  transition_s: 0.25  # cross-fade between shots; 0 = hard cuts
  tail_s: 1.2  # quiet ending after the last word, so the video does not stop abruptly
  fade_out_s: 0.8  # picture and sound fade out over the end
  foreground: "square"  # square = middle of the clip fills 1080x1080; wide = whole landscape frame
  zoom_max: 1.07  # slow push-in over each shot
  luma_target: 55  # dark clips are brightened towards this average (0-255)
  gamma_cap: 1.5

quality:
  lufs_min: -17.5
  lufs_max: -14.5
  max_sync_error_s: 0.12  # median gap between real speech starts and subtitle starts
  max_black_s: 1.0
  max_freeze_s: 3.0
  min_luma: 25  # a shot darker than this (0-255) is flagged
  min_clip_probability: 0.5  # a clip that matches its sentence worse than this is flagged

branding:
  channel_name: "@NamaChannelAnda"  # placeholder: replace with your channel name (the web profile will set it)
  watermark: true
  popup_at_s: [3.0]  # seconds at which the white pop-up appears
  popup_seconds: 2.6
  title_card: true  # the video title over the first seconds
  title_seconds: 2.5

music:
  mode: "ambient"  # off | ambient (synthesised pad, no licence) | tracks (your files in assets/music)
  target_lufs: -23  # loudness of the music bed itself; the voice is at -16
  gain_db: 0  # extra trim after that
  duck: true  # music eases down by a few dB while the voice speaks

graphics:
  enabled: true  # before/after bars for two amounts in the same unit, drawn from the script text
  max_per_video: 2
  units: [miles, kilometers, km, meters, feet, degrees, percent, kg, tons, pounds, mph]

subtitles:
  font_name: "Poppins"  # file in assets/fonts/
  font_size: 96
  margin_bottom: 520  # keeps text above the YouTube interface
  max_words_per_subtitle: 4

asr:
  model: "small.en"  # faster-whisper model; downloaded once on first use
  device: "auto"  # auto = GPU if CUDA works, else CPU

search:
  depth: "basic"  # basic = 1 Tavily credit per search, advanced = 2
  max_results: 8  # one Tavily credit per search whatever the count
  credit_usd: 0.0  # free plan; set 0.008 if you move to pay-as-you-go
  monthly_credit_limit: 900  # the free plan gives 1000; stop before it overflows

research:
  max_queries: 6  # SPEC 7.2: 3-6 queries
  min_distinct_domains: 2  # the hook rule (SPEC 7.3 rule 5) needs two independent domains
  max_sources: 6  # SPEC 7.2: the top 3-6 tier A/B pages
  max_sources_per_domain: 2
  max_chars_per_source: 12000  # about 3K tokens each; bounds the Sonnet extraction cost

script:
  max_rewrites: 3  # SPEC 7.4 says twice; raised to three with the user's approval (ADR 0022)
  # Words in the distinct verified claims below which a topic is dropped before any draft is paid for.
  # Measured: a script uses 58-80% of that material; Venus had 67 words and could not reach 91.
  min_claim_words: 100
  min_body_segments: 3
  max_body_segments: 5
  max_second_person_uses: 1  # style guide: address the viewer as "you" at most once
  forbidden_phrases:  # style guide: no filler openers and no calls to action
    - did you know
    - hey guys
    - in today's video
    - like and subscribe
    - follow for more
    - subscribe
    - comment below
  overstatement_words:  # allowed only when a cited claim states the word itself
    - the only
    - always
    - never
    - most
    - insane
    - mind-blowing
    - biggest
    - largest
    - smallest
    - fastest
    - slowest
    - strongest
    - deadliest
    - smartest
    - best
    - worst

produce:
  max_attempts_per_script: 3  # topics tried per requested script before the run stops
