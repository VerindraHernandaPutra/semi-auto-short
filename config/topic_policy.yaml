# The channel covers space and astronomy (ADR 0023).
active_categories:
  - planets_and_moons
  - stars_and_the_sun
  - space_phenomena

series:
  - name: "Everyone Gets This Wrong"
    structure: "misconception -> fact -> reason"
    hook_pattern: "The hook fact, stated plainly."
  - name: "Strange Worlds"
    structure: "observation -> mechanism -> conclusion"
    hook_pattern: "The hook fact, stated plainly."
  - name: "Cosmic Scale"
    structure: "comparison -> measurement -> meaning"
    hook_pattern: "The hook fact, stated plainly."

